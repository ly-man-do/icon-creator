server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # data/icons.js is ~630 KB of geometry and compresses hard, so this is the
    # difference between a snappy first load and a sluggish one over Wi-Fi.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Filenames carry no content hash, so a long max-age would strand people on
    # a stale app after an update. nginx still sends ETags, so revalidation is a
    # cheap 304 rather than a full re-download.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Deliberately no Content-Security-Policy. The app builds its exports as
    # blob: URLs and standalone.html carries an inline module script, so a strict
    # policy has to be written around both. See the Docker notes in README.md
    # before adding one.

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
